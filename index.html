<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS Stock Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top Header -->
    <header class="app-header">
        <div class="brand">
            <span class="brand-icon">📦</span>
            <span class="brand-title">WMS Portal</span>
        </div>
        <div class="header-right">
            <span class="sync-status" id="syncStatus">
                <span class="dot"></span> Online
            </span>
            <span class="clock" id="liveClock">00:00:00</span>
        </div>
    </header>

    <!-- Main Screens Container -->
    <main class="main-content">

        <!-- 1. Stock Register Screen -->
        <section id="screenStock" class="app-screen active">
            <div class="stats-row">
                <div class="stat-card blue">
                    <span class="stat-label">Total Stock (PCs)</span>
                    <span class="stat-val" id="totalStockPcs">0</span>
                </div>
                <div class="stat-card green">
                    <span class="stat-label">Total Products</span>
                    <span class="stat-val" id="totalUniqueProducts">0</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Live Stock Register</h2>
                    <input type="text" id="stockSearchInput" placeholder="Search product or serial..." class="search-input">
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th style="text-align: right;">Available</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <tr><td colspan="2" class="empty-state">No stock registered yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 2. Inbound (Stock Inward) Screen -->
        <section id="screenInbound" class="app-screen">
            <div class="card">
                <div class="card-header">
                    <h2>Inbound Entry (Stock In)</h2>
                    <span class="badge blue">Receiving</span>
                </div>
                <form id="formInbound" class="app-form">
                    <div class="form-group">
                        <label>Vehicle / Source (Optional)</label>
                        <input type="text" id="inboundVehicle" placeholder="e.g. MH-04-AB-1234">
                    </div>
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="inboundProduct" placeholder="e.g. LED Monitor 19.5" required>
                    </div>
                    <div class="form-group">
                        <label>Serial Number (Single or Comma Separated) *</label>
                        <textarea id="inboundSerials" placeholder="Scan barcode or type serials (e.g. SN001, SN002)..." rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Box / Batch No.</label>
                        <input type="text" id="inboundBox" placeholder="e.g. Box 1">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Inward Stock</button>
                </form>
            </div>
        </section>

        <!-- 3. Outbound (Dispatch) Screen -->
        <section id="screenOutbound" class="app-screen">
            <div class="card">
                <div class="card-header">
                    <h2>Outbound Entry (Dispatch)</h2>
                    <span class="badge rose">Shipping</span>
                </div>
                <form id="formOutbound" class="app-form">
                    <div class="form-group">
                        <label>Party / Shop Name *</label>
                        <input type="text" id="outboundShop" placeholder="e.g. Krishna Enterprises" required>
                    </div>
                    <div class="form-group">
                        <label>Invoice / SO Number *</label>
                        <input type="text" id="outboundInvoice" placeholder="e.g. INV-2026-001" required>
                    </div>
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="outboundProduct" placeholder="Select or type product name" required>
                    </div>
                    <div class="form-group">
                        <label>Scan Serial to Dispatch *</label>
                        <input type="text" id="outboundSerial" placeholder="Scan dispatched barcode..." required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-rose">Confirm Dispatch</button>
                </form>
            </div>
        </section>

        <!-- 4. Activity Logs Screen -->
        <section id="screenLogs" class="app-screen">
            <div class="card">
                <div class="card-header">
                    <h2>Recent Activities</h2>
                    <button type="button" class="btn-clear" id="btnResetDatabase">Wipe Data</button>
                </div>
                <div class="logs-container" id="activityLogsList">
                    <div class="empty-state">No activities recorded yet.</div>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar (Phone Optimized) -->
    <nav class="bottom-nav">
        <button class="nav-tab active" data-target="screenStock">
            <span class="nav-icon">📊</span>
            <span class="nav-text">Stock</span>
        </button>
        <button class="nav-tab" data-target="screenInbound">
            <span class="nav-icon">📥</span>
            <span class="nav-text">Inward</span>
        </button>
        <button class="nav-tab" data-target="screenOutbound">
            <span class="nav-icon">📤</span>
            <span class="nav-text">Dispatch</span>
        </button>
        <button class="nav-tab" data-target="screenLogs">
            <span class="nav-icon">📋</span>
            <span class="nav-text">Logs</span>
        </button>
    </nav>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
